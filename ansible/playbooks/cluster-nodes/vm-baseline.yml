---
- name: Apply OS baseline to Nodes
  hosts: nodes

  tasks:
    - name: Add all cluster nodes to /etc/hosts
      ansible.builtin.blockinfile:
        path: /etc/hosts
        marker: "# {mark} --- ANSIBLE MANAGED: cluster nodes ---"
        block: |
          {% for node in groups['nodes'] %}
          {{ hostvars[node].ansible_host }} {{ node }}
          {% endfor %}
          {{ hostvars['cp1'].ansible_host }} {{ k8s_api_endpoint_name }}
