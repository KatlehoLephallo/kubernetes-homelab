---
- name: Install Virtualisation Packages and enable services
  hosts: hypervisors

  tasks:
    - name: Install Virtualisation Packages
      ansible.builtin.dnf:
        name:
          - qemu-kvm
          - libvirt
          - libvirt-client
          - virt-install
          - python3-libvirt
        state: present

    - name: Enable and start libvirt modular daemon sockets
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: "{{ 'started' if item.endswith('.socket') else omit }}"
      loop: "{{ libvirt_daemons | product(['.service', '.socket', '-ro.socket', '-admin.socket']) | map('join') | list }}"
      vars:
        libvirt_daemons:
          - virtqemud
          - virtnetworkd
          - virtstoraged
          - virtnodedevd
          - virtsecretd
          - virtnwfilterd

    - name: Enable libvirt helper sockets (logging and locking for VMs)
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - virtlogd.socket
        - virtlogd-admin.socket
        - virtlockd.socket
        - virtlockd-admin.socket

    - name: Verify libvirt responds
      ansible.builtin.command: virsh --connect qemu:///system list --all
      register: virsh_list
      changed_when: false
