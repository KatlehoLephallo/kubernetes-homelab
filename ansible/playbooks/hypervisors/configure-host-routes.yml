---
- name: Configure persistent static routes between hypervisors
  hosts: hypervisors

  tasks:
    - name: Read routes currently saved on the NetworkManager profile
      ansible.builtin.command: nmcli -g ipv4.routes connection show "{{ wifi_profile }}"
      register: current_routes
      changed_when: false

    - name: Add route to each other hypervisor's VM subnet
      ansible.builtin.command: >
        nmcli connection modify "{{ wifi_profile }}"
        +ipv4.routes "{{ hostvars[item].vm_subnet }} {{ hostvars[item].host_ip }}"
      loop: "{{ groups['hypervisors'] | difference([inventory_hostname]) }}"
      when: (hostvars[item].vm_subnet ~ ' ' ~ hostvars[item].host_ip) not in current_routes.stdout
      changed_when: true
      notify: Reapply network connection

  handlers:
    - name: Reapply network connection
      ansible.builtin.command: nmcli device reapply "{{ vm_uplink }}"
